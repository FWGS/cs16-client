              _out = []
              for _ln in _src:
                  _m = _re.match(r'^(touch_addbutton "[^"]*" "[^"]*" "([^"]*)" )([-\d.]+) ([-\d.]+) ([-\d.]+) ([-\d.]+)( .*)$', _ln)
                  if _m and _m.group(2) not in ('_move', '_look'):
                      x1, y1, x2, y2 = [float(_m.group(i)) for i in (3, 4, 5, 6)]
                      cx, cy, hw, hh = (x1 + x2) / 2, (y1 + y2) / 2, (x2 - x1) * _k / 2, (y2 - y1) * _k / 2
                      cx = min(max(cx, hw), 1 - hw); cy = min(max(cy, hh), 1 - hh)
                      _ln = '%s%.6f %.6f %.6f %.6f%s' % (_m.group(1), cx - hw, cy - hh, cx + hw, cy + hh, _m.group(7))
                  _ln = _ln.replace('touch_profiles/boosttop_pro.cfg', 'touch_profiles/boosttop_pro_%s.cfg' % _nm)
