name: cssborka.uz Android APK (bitta APK, dvijok ichida)
on:
  push:
  workflow_dispatch:

jobs:
  # 1) Xash3D FWGS dvijogini rasmiy skriptlar bilan yig'ish
  engine:
    name: Xash3D dvijogi
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: 2.32.10
      FFMPEG_VERSION: '9.0'
      GH_CPU_ARCH: multiarch
      GH_CPU_OS: android
    steps:
      - name: Checkout Xash3D FWGS
        uses: actions/checkout@v5
        with:
          repository: FWGS/xash3d-fwgs
          # mahkamlangan versiya: dvijokning eng yangisi bizning XashActivity bilan mos kelmay qoldi (2026-11, util/Prefs)
          ref: d6b54aaf6c1d8518e08404a842f3f6ee02cef3cc
          submodules: recursive
      - name: Install dependencies
        run: bash scripts/gha/deps_android.sh
      - name: Patch gyro (PRO - yumshoq va aniq)
        run: |
          python3 - <<'PY'
          p = 'engine/client/input/in_gyro.c'
          s = open(p, encoding='utf-8').read()
          def must(a, b):
              global s
              assert a in s, a
              s = s.replace(a, b, 1)
          must('static CVAR_DEFINE_AUTO( gyro_debug, "0", 0, "visualize built-in device gyroscope" );',
               'static CVAR_DEFINE_AUTO( gyro_debug, "0", 0, "visualize built-in device gyroscope" );\n'
               'static CVAR_DEFINE_AUTO( gyro_smooth, "0.5", FCVAR_ARCHIVE | FCVAR_FILTERABLE, "gyro smoothing 0..0.9 (removes hand shake)" );\n'
               'static CVAR_DEFINE_AUTO( gyro_soft, "1", FCVAR_ARCHIVE | FCVAR_FILTERABLE, "soft deadzone: tiny movements are damped, not cut" );\n'
               'static vec3_t gyro_filtered;')
          must('\tCvar_RegisterVariable( &gyro_debug );',
               '\tCvar_RegisterVariable( &gyro_debug );\n\tCvar_RegisterVariable( &gyro_smooth );\n\tCvar_RegisterVariable( &gyro_soft );')
          old_start = '\tif( fabs( mapped_speed[0] ) < gyro_pitch_deadzone.value )'
          old_end = '\t*dpitch -= gyro_pitch.value'
          i = s.index(old_start); j = s.index(old_end)
          s = s[:i] + (
              '\t{\n'
              '\t\tfloat a = bound( 0.0f, gyro_smooth.value, 0.9f );\n'
              '\t\tconst float dz[3] = { gyro_pitch_deadzone.value, gyro_yaw_deadzone.value, gyro_roll_deadzone.value };\n'
              '\t\tfor( int k = 0; k < 3; k++ )\n'
              '\t\t{\n'
              '\t\t\tgyro_filtered[k] = gyro_filtered[k] * a + mapped_speed[k] * ( 1.0f - a );\n'
              '\t\t\tfloat v = gyro_filtered[k];\n'
              '\t\t\tfloat av = fabs( v );\n'
              '\t\t\tif( gyro_soft.value && dz[k] > 0.0f )\n'
              '\t\t\t{\n'
              '\t\t\t\tif( av < dz[k] * 2.0f ) v *= av / ( dz[k] * 2.0f );\n'
              '\t\t\t}\n'
              '\t\t\telse if( av < dz[k] ) v = 0.0f;\n'
              '\t\t\tmapped_speed[k] = v;\n'
              '\t\t}\n'
              '\t}\n\n') + s[j:]
          open(p, 'w', encoding='utf-8').write(s)
          print('in_gyro.c patched')
          PY
      - name: Patch touch + avto qayta ulanish
        run: |
          python3 - <<'PY'
          p = 'engine/client/input/in_touch.c'
          s = open(p, encoding='utf-8').read()
          def must(a, b):
              global s
              assert s.count(a) == 1, ('not unique/missing', a[:80])
              s = s.replace(a, b, 1)
          must('static CVAR_DEFINE_AUTO( touch_precise_amount, "0.5", FCVAR_FILTERABLE, "sensitivity multiplier for precise-look" );',
               'static CVAR_DEFINE_AUTO( touch_precise_amount, "0.5", FCVAR_FILTERABLE, "sensitivity multiplier for precise-look" );\n'
               'static CVAR_DEFINE_AUTO( touch_aimfire, "1", FCVAR_ARCHIVE | FCVAR_FILTERABLE, "aim with the finger that holds +attack button" );')
          must('\tCvar_RegisterVariable( &touch_precise_amount );',
               '\tCvar_RegisterVariable( &touch_precise_amount );\n\tCvar_RegisterVariable( &touch_aimfire );')
          must('''				// increase precision
          				if( FBitSet( button->flags, TOUCH_FL_PRECISION ))
          					touch.precision = true;

          				result = true;
          			}
          			else if( button->type == touch_wheel )''',
          '''				// increase precision
          				if( FBitSet( button->flags, TOUCH_FL_PRECISION ))
          					touch.precision = true;

          				result = true;

          				// boost-top: otish tugmasini bosib turgan barmoq bilan nishonga olish
          				if( touch_aimfire.value && !Q_strncmp( button->command, "+attack", 7 ) && touch.move_finger != fingerID )
          				{
          					if( touch.look_finger == -1 )
          						touch.look_finger = fingerID;
          					return true; // ostidagi yurish zonasi bu barmoqni olib qo'ymasin
          				}
          			}
          			else if( button->type == touch_wheel )''')
          must('''				// disable precision mode
          				if( FBitSet( button->flags, TOUCH_FL_PRECISION ))
          					touch.precision = false;

          				result = true;
          			}
          			// handle wheel end''',
          '''				// disable precision mode
          				if( FBitSet( button->flags, TOUCH_FL_PRECISION ))
          					touch.precision = false;

          				// boost-top: otish tugmasi qo'yib yuborilsa nishon ham bo'shaydi
          				if( touch.look_finger == fingerID && !Q_strncmp( button->command, "+attack", 7 ))
          					touch.look_finger = -1;

          				result = true;
          			}
          			// handle wheel end''')

          # boost-top: yangi qulay tugma joylashuvi hamma o'yinchilarga bir marta qo'llanadi
          must('static CVAR_DEFINE_AUTO( touch_aimfire, "1", FCVAR_ARCHIVE | FCVAR_FILTERABLE, "aim with the finger that holds +attack button" );',
               'static CVAR_DEFINE_AUTO( touch_aimfire, "1", FCVAR_ARCHIVE | FCVAR_FILTERABLE, "aim with the finger that holds +attack button" );\n'
               'static CVAR_DEFINE_AUTO( bt_touch_layout, "0", FCVAR_ARCHIVE | FCVAR_PRIVILEGED, "boost-top touch layout version" );')
          must('\tCvar_RegisterVariable( &touch_aimfire );',
               '\tCvar_RegisterVariable( &touch_aimfire );\n\tCvar_RegisterVariable( &bt_touch_layout );')
          must("""	if( FS_FileExists( touch_config_file.string, true ) )
          	{
          		Cbuf_AddTextf( "exec \\"%s\\"\\n", touch_config_file.string );
          		Cbuf_Execute();
          	}
          	else Touch_LoadDefaults_f();
          """, """	qboolean bt_new = bt_touch_layout.value < 5 && FS_FileExists( "touch_presets/boosttop_pro.cfg", false );
          	if( bt_new )
          	{
          		Cbuf_AddText( "exec \\"touch_presets/boosttop_pro.cfg\\"\\n" );
          		Cbuf_Execute();
          		Cvar_DirectSet( &bt_touch_layout, "5" );
          	}
          	else if( FS_FileExists( touch_config_file.string, true ) )
          	{
          		Cbuf_AddTextf( "exec \\"%s\\"\\n", touch_config_file.string );
          		Cbuf_Execute();
          	}
          	else Touch_LoadDefaults_f();
          """)
          must("""	touch.configchanged = false;
          	touch.config_loaded = true;
          }""", """	Touch_HideButtons( "x_*", true, true ); // boost-top: qo'shimcha panel har doim yopiq boshlanadi
          	touch.configchanged = bt_new; // yangi joylashuv faylga saqlansin
          	touch.config_loaded = true;
          }""")
          open(p, 'w', encoding='utf-8').write(s)
          print('in_touch.c patched (aim while firing + boosttop layout)')

          # boost-top: internet uzilib qolsa serverga o'zi qayta ulanadi
          p = 'engine/client/cl_main.c'
          s = open(p, encoding='utf-8').read()
          must('CVAR_DEFINE_AUTO( cl_timeout, "60", 0, "connect timeout (in-seconds)" );',
               'CVAR_DEFINE_AUTO( cl_timeout, "60", 0, "connect timeout (in-seconds)" );\n'
               'static CVAR_DEFINE_AUTO( cl_autoreconnect, "1", FCVAR_ARCHIVE, "reconnect automatically after connection timeout" );')
          must('\tCvar_RegisterVariable( &cl_timeout );',
               '\tCvar_RegisterVariable( &cl_timeout );\n\tCvar_RegisterVariable( &cl_autoreconnect );')
          must("""			Con_Printf( "\\nServer connection timed out.\\n" );
          			CL_Disconnect();
          			return;""", """			Con_Printf( "\\nServer connection timed out.\\n" );
          			CL_Disconnect();
          			if( cl_autoreconnect.value && !SV_Active( ))
          			{
          				Con_Printf( "Avto qayta ulanish...\\n" );
          				Cbuf_AddText( "retry\\n" );
          			}
          			return;""")
          open(p, 'w', encoding='utf-8').write(s)
          print('cl_main.c patched (auto reconnect)')
          PY
      - name: Patch yuklashda qotib qolish (fayl yo'q serverlar)
        run: |
          python3 - <<'PY'
          p = 'engine/client/cl_main.c'
          s = open(p, encoding='utf-8').read()
          def must(a, b):
              global s
              assert s.count(a) == 1, ('not unique/missing', a[:80])
              s = s.replace(a, b, 1)
          must('CVAR_DEFINE_AUTO( cl_download_ingame, "1", FCVAR_ARCHIVE, "allow to downloading resources while client is active" );',
               'CVAR_DEFINE_AUTO( cl_download_ingame, "1", FCVAR_ARCHIVE, "allow to downloading resources while client is active" );\n'
               'static CVAR_DEFINE_AUTO( cl_dl_stuck, "20", FCVAR_ARCHIVE, "skip resource downloads that make no progress for N seconds (0 = never)" );')
          must('\tCvar_RegisterVariable( &cl_download_ingame );',
               '\tCvar_RegisterVariable( &cl_download_ingame );\n\tCvar_RegisterVariable( &cl_dl_stuck );')
          must('''/*
          ==================
          Host_ClientFrame
          ''', r'''/*
          ==================
          CL_BtDownloadWatchdog

          boost-top: server fayl bera olmasa (fastdl yo'q / fayl yo'q) ba'zi fayllar
          "kerakli" ro'yxatida abadiy qolib, "Downloading [N remaining]" da qotib qolinardi.
          Yuklash cl_dl_stuck soniya siljimasa - qolgan fayllar o'tkazib yuboriladi
          (kompyuterdagi CS 1.6 kabi), o'yin serverga kiraveradi.
          ==================
          */
          static void CL_BtDownloadWatchdog( void )
          {
          	static double	stuck_since;
          	static int	last_count = -1;
          	static float	last_pct = -2.0f;
          	resource_t	*p;
          	float		pct;
          	int		skipped = 0;

          	if( cls.state == ca_disconnected || cls.state == ca_active || cls.demoplayback || cl_dl_stuck.value <= 0.0f
          		|| !cl.resourcesneeded.pNext || cl.resourcesneeded.pNext == &cl.resourcesneeded )
          	{
          		last_count = -1;
          		return;
          	}

          	pct = Cvar_VariableValue( "scr_download" );
          	if( last_count != host.downloadcount || pct != last_pct )
          	{
          		last_count = host.downloadcount;
          		last_pct = pct;
          		stuck_since = host.realtime;
          		return;
          	}

          	if( host.realtime - stuck_since < cl_dl_stuck.value )
          		return;

          	HTTP_ResetProcessState(); // navbatdagi http fayllar keyin qayta ro'yxatdan o'tkazmasin

          	if( cls.netchan.tempbuffer )
          		Mem_Free( cls.netchan.tempbuffer );
          	cls.netchan.tempbuffer = NULL;
          	cls.netchan.tempbuffersize = 0;

          	while(( p = cl.resourcesneeded.pNext ) != &cl.resourcesneeded )
          	{
          		Con_Printf( S_WARN "skipped download: %s\n", p->szFileName );
          		CL_MoveToOnHandList( p );
          		skipped++;
          	}
          	Con_Printf( "Yuklab bo'lmagan %d ta fayl o'tkazib yuborildi, serverga kirilyapti...\n", skipped );

          	host.downloadcount = 0;
          	last_count = -1;
          	Cvar_SetValue( "scr_download", -1.0f );

          	{
          		byte	msg_buf[MAX_INIT_MSG];
          		sizebuf_t msg;

          		MSG_Init( &msg, "Resource Registration", msg_buf, sizeof( msg_buf ));

          		if( CL_PrecacheResources( ))
          			CL_RegisterResources( &msg, cls.net_protocol );

          		if( MSG_GetNumBytesWritten( &msg ) > 0 )
          		{
          			Netchan_CreateFragments( &cls.netchan, &msg );
          			Netchan_FragSend( &cls.netchan );
          		}
          	}
          }

          /*
          ==================
          Host_ClientFrame
          ''')
          must('''	// procssing resources on handle
          	while( CL_RequestMissingResources( ));
          ''', '''	// procssing resources on handle
          	while( CL_RequestMissingResources( ));

          	// boost-top: qotib qolgan yuklashlarni o'tkazib yuborish
          	CL_BtDownloadWatchdog();
          ''')
          open(p, 'w', encoding='utf-8').write(s)
          print('cl_main.c patched (download watchdog)')
          PY
      - name: Build engine
        run: bash scripts/gha/build_android.sh
      - name: Collect engine parts
        run: |
          mkdir -p out/java/su/xash/engine/util
          cp artifacts/xash3d-fwgs-android.apk out/engine.apk
          cp -r 3rdparty/SDL/android-project/app/src/main/java/org out/java/
          cp android/app/src/main/java/su/xash/engine/XashActivity.java out/java/su/xash/engine/
          cp android/app/src/main/java/su/xash/engine/util/SoftKeyboardPan.java out/java/su/xash/engine/util/
          ls -la out
      - name: Upload engine parts
        uses: actions/upload-artifact@v4
        with:
          name: engine-parts
          path: out/

  # 2) CS16Client + bosh ekran + dvijok = bitta APK
  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: engine
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Download engine parts
        uses: actions/download-artifact@v4
        with:
          name: engine-parts
          path: engine
      - name: Put engine inside the app
        run: |
          python3 - <<'PY'
          import os, re, shutil, zipfile
          app = 'android/app/src/main'
          z = zipfile.ZipFile('engine/engine.apk')
          skip = re.compile(r'(menu|client|server|hl|yapb|dlls|^libcs)', re.I)
          for n in z.namelist():
              if n.startswith('lib/') and n.endswith('.so'):
                  _, abi, name = n.split('/', 2)
                  if skip.search(name):
                      print('skip lib', abi, name); continue
                  dst = os.path.join(app, 'jniLibs', abi, name)
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  open(dst, 'wb').write(z.read(n)); print('lib', abi, name)
              elif n.startswith('assets/') and not n.endswith('/'):
                  dst = os.path.join(app, 'engine_assets', n[len('assets/'):])
                  os.makedirs(os.path.dirname(dst), exist_ok=True)
                  open(dst, 'wb').write(z.read(n)); print('asset', n)
          # dvijokning Java qismi (SDL + XashActivity)
          shutil.copytree('engine/java', os.path.join(app, 'java'), dirs_exist_ok=True)
          p = os.path.join(app, 'java/su/xash/engine/XashActivity.java')
          s = open(p, encoding='utf-8').read()
          s = s.replace('import su.xash.engine.util.CrashReports;', '')
          s = s.replace('CrashReports.STACKTRACE_NAME', '"stacktrace.txt"')
          s = s.replace('CrashReports.writeSystemInfo(this);', '')
          s = re.sub(r'CrashReports\.writeIntentInfo\([^;]*\);', '', s)
          assert 'CrashReports' not in s, 'CrashReports qoldi'
          open(p, 'w', encoding='utf-8').write(s)

          # boost-top: telefon uchun silliq boshqaruv va yengil grafika (har ishga tushganda)
          ud = os.path.join(app, 'engine_assets', 'userconfig.d')
          os.makedirs(ud, exist_ok=True)
          open(os.path.join(ud, 'zz_boosttop_mobile.cfg'), 'w', encoding='utf-8').write('\n'.join([
              '// boost-top: telefon uchun',
              'touch_aimfire "1"',
              'touch_nonlinear_look "1"',
              'touch_pow_factor "1.25"',
              'touch_pow_mult "300"',
              'touch_exp_mult "0"',
              'cl_weather "0"',
              'cl_gunsmoke "0"',
              'cl_shadows "0"',
              'cl_corpsestay "0"',
              'r_decals "100"',
              'mp_decals "50"',
              'cl_timeout "25"',
              'cl_autoreconnect "1"',
              "// server fayl bermasa qotib qolmaslik: 20 s siljimasa o'tkazib yuboriladi",
              'cl_dl_stuck "20"',
              'http_timeout "15"',
              'vibration_enable "1"',
              "// #34 dagi grafika buzilishini tuzatish (video.cfg da qolib ketgan qiymatlar)",
              'gl_texture_lodbias "0"',
              'r_lighting_extended "1"',
              'net_graph "0"',
              "// sezgirlik: Sekin / O'rtacha / Tez",
              'alias bt_sens_1 "touch_yaw 40; touch_pitch 32; gyro_yaw 0.9; gyro_pitch 0.75; echo Sezgirlik: SEKIN; alias bt_sens bt_sens_2"',
              'alias bt_sens_2 "touch_yaw 55; touch_pitch 45; gyro_yaw 1.2; gyro_pitch 1.0; echo Sezgirlik: ORTACHA; alias bt_sens bt_sens_3"',
              'alias bt_sens_3 "touch_yaw 75; touch_pitch 60; gyro_yaw 1.6; gyro_pitch 1.3; echo Sezgirlik: TEZ; alias bt_sens bt_sens_1"',
              'alias bt_sens "bt_sens_3"',
              '// batareya rejimi',
              'alias bt_batt_on "fps_max 60; echo Batareya rejimi: YONIQ (60 FPS); alias bt_batt bt_batt_off"',
              'alias bt_batt_off "fps_max 100; echo Batareya rejimi: OCHIQ; alias bt_batt bt_batt_on"',
              'alias bt_batt "bt_batt_on"',
              '// chapaqay / oddiy tugmalar',
              'alias bt_hand_l "exec touch_presets/boosttop_left.cfg; echo Tugmalar: CHAPAQAY; alias bt_hand bt_hand_r"',
              'alias bt_hand_r "exec touch_presets/boosttop_pro.cfg; echo Tugmalar: ODDIY; alias bt_hand bt_hand_l"',
              'alias bt_hand "bt_hand_l"',
              "// qo'shimcha panel (⚙)",
              'alias bt_more_on "touch_show x_*; alias bt_more bt_more_off"',
              'alias bt_more_off "touch_hide x_*; alias bt_more bt_more_on"',
              'alias bt_more "bt_more_on"',
              '// pritsel (krestik) variantlari',
              'alias bt_xh_1 "xhair_enable 1; xhair_color \\"0 255 0 255\\"; xhair_size 4; xhair_gap 2; xhair_thick 1; xhair_dot 0; echo Pritsel: YASHIL; alias bt_xh bt_xh_2"',
              'alias bt_xh_2 "xhair_enable 1; xhair_color \\"255 40 40 255\\"; xhair_size 5; xhair_gap 2; xhair_thick 1; xhair_dot 0; echo Pritsel: QIZIL; alias bt_xh bt_xh_3"',
              'alias bt_xh_3 "xhair_enable 1; xhair_color \\"0 230 255 255\\"; xhair_size 4; xhair_gap 1; xhair_thick 1; xhair_dot 0; echo Pritsel: MOVIY; alias bt_xh bt_xh_4"',
              'alias bt_xh_4 "xhair_enable 1; xhair_color \\"255 230 0 255\\"; xhair_size 3; xhair_gap 2; xhair_thick 1; xhair_dot 1; echo Pritsel: SARIQ + NUQTA; alias bt_xh bt_xh_5"',
              'alias bt_xh_5 "xhair_enable 0; echo Pritsel: KLASSIK; alias bt_xh bt_xh_1"',
              'alias bt_xh "bt_xh_1"',
              "// FPS / ping ko'rsatish",
              'alias bt_fps_on "net_graph 1; echo FPS/ping: YONIQ; alias bt_fps bt_fps_off"',
              'alias bt_fps_off "net_graph 0; echo FPS/ping: OCHIQ; alias bt_fps bt_fps_on"',
              'alias bt_fps "bt_fps_on"',
              '// ultra yengil grafika (kuchsiz telefonlar uchun)',
              'alias bt_lite_on "r_dynamic 0; r_decals 0; mp_decals 0; cl_minmodels 1; cl_himodels 0; echo Ultra yengil: YONIQ; alias bt_lite bt_lite_off"',
              'alias bt_lite_off "r_dynamic 1; r_decals 100; mp_decals 50; cl_minmodels 0; echo Ultra yengil: OCHIQ; alias bt_lite bt_lite_on"',
              'alias bt_lite "bt_lite_on"',
              "// tugma o'lchami: katta / kichik / oddiy",
              'alias bt_size_1 "exec touch_presets/boosttop_pro_big.cfg; echo Tugmalar: KATTA; alias bt_size bt_size_2"',
              'alias bt_size_2 "exec touch_presets/boosttop_pro_small.cfg; echo Tugmalar: KICHIK; alias bt_size bt_size_3"',
              'alias bt_size_3 "exec touch_presets/boosttop_pro.cfg; echo Tugmalar: ODDIY; alias bt_size bt_size_1"',
              'alias bt_size "bt_size_1"',
          ]) + '\n')
          # ilova build raqami (avtomatik yangilanish uchun)
          os.makedirs(os.path.join(app, 'engine_assets'), exist_ok=True)
          open(os.path.join(app, 'engine_assets', 'bt_build.txt'), 'w').write(os.environ.get('GITHUB_RUN_NUMBER', '0'))

          # touch tugmalari rasmlari, menyu fayllari, bot sozlamalari -> APK ichiga (binafsha kvadratlar bo'lmasin)
          ea = os.path.join(app, 'engine_assets')
          for src in ['3rdparty/cs16client-extras', '3rdparty/yapb/cfg']:
              shutil.copytree(src, ea, dirs_exist_ok=True); print('extras', src)
          # Ekrandagi ⚙ (touch_edit) tugmasi tugma muharririni emas, o'yin menyusini ochsin
          n_edit = 0
          for root, _, files in os.walk(ea):
              for fn in files:
                  if not fn.endswith('.cfg'): continue
                  fp = os.path.join(root, fn)
                  t = open(fp, encoding='utf-8', errors='replace').read()
                  t2 = re.sub(r'^(\s*touch_addbutton\s+"[^"]*edit[^"]*"\s+"[^"]*"\s+)"[^"]*"',
                              r'\1"togglemenu"', t, flags=re.M | re.I)
                  if t2 != t:
                      open(fp, 'w', encoding='utf-8').write(t2); n_edit += 1; print('touch_edit ->', fp)
          print('touch cfg patched:', n_edit)
          # boost-top: qulay PRO tugma joylashuvi (dvijok uni hammaga bir marta qo'llaydi)
          os.makedirs(os.path.join(ea, 'touch_presets'), exist_ok=True)
          open(os.path.join(ea, 'touch_presets', 'boosttop_pro.cfg'), 'w', encoding='utf-8').write('\n'.join([
              "// boost-top PRO telefon tugmalari (oson o'ynash uchun)",
              'touch_config_file "touch_profiles/boosttop_pro.cfg"',
              'touch_forwardzone "0.110000"',
              'touch_sidezone "0.065000"',
              'touch_pitch "45.000000"',
              'touch_yaw "55.000000"',
              'touch_grid_count "50"',
              'touch_grid_enable "1"',
              'touch_set_stroke 1 255 59 59 200',
              'touch_highlight_r "1.000000"',
              'touch_highlight_g "0.300000"',
